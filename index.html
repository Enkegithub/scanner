<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tech Genesis 2K26 Scanner</title>

  <!-- QR SCANNER LIBRARY -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f3f8f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 25px 18px 40px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin: 15px 0 30px;
      font-weight: 700;
    }

    /* =========================
       SCANNER
    ========================= */

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto 25px;
      background: white;
      border-radius: 18px;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      border-radius: 15px;
    }

    #reader img {
      max-width: 100%;
    }

    /* =========================
       DETAILS CARD
    ========================= */

    .details {
      background: white;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .label {
      font-size: 14px;
      font-weight: 600;
      color: #555;
      margin-top: 12px;
      margin-bottom: 6px;
    }

    .value {
      min-height: 48px;
      display: flex;
      align-items: center;
      padding: 12px 15px;
      background: #f3f3f3;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      word-break: break-word;
    }

    /* =========================
       BUTTONS
    ========================= */

    button {
      width: 100%;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      padding: 15px;
    }

    #verifyBtn {
      margin-top: 22px;
      background: #00ADAC;
      color: white;
    }

    #verifyBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #resetBtn {
      margin-top: 12px;
      background: white;
      color: #222;
      border: 2px solid #ddd;
    }

    /* =========================
       STATUS
    ========================= */

    #status {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      line-height: 1.4;
    }

    .success {
      display: block !important;
      background: #dff7e8;
      color: #137333;
    }

    .error {
      display: block !important;
      background: #ffe4e4;
      color: #b42318;
    }

    .info {
      display: block !important;
      background: #e5f6f6;
      color: #007b7a;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .container {
        padding: 20px 15px 30px;
      }

      h1 {
        font-size: 30px;
      }

      .details {
        padding: 20px;
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <h1>Tech Genesis 2K26</h1>


    <!-- ==================================================
         QR SCANNER
    =================================================== -->

    <div id="reader"></div>


    <!-- ==================================================
         PARTICIPANT DETAILS
    =================================================== -->

    <div class="details">


      <!-- REGISTRATION ID -->

      <div class="label">
        Registration ID
      </div>

      <div
        class="value"
        id="reg_id"
      >
        —
      </div>


      <!-- TEAM -->

      <div class="label">
        Team Name
      </div>

      <div
        class="value"
        id="team"
      >
        —
      </div>


      <!-- LEADER -->

      <div class="label">
        Team Leader
      </div>

      <div
        class="value"
        id="leader"
      >
        —
      </div>


      <!-- MEMBERS -->

      <div class="label">
        Members
      </div>

      <div
        class="value"
        id="members"
      >
        —
      </div>


      <!-- EVENT -->

      <div class="label">
        Event(s)
      </div>

      <div
        class="value"
        id="events"
      >
        —
      </div>


      <!-- STATUS -->

      <div id="status"></div>


      <!-- VERIFY BUTTON -->

      <button
        id="verifyBtn"
        onclick="verifyAndSubmit()"
        disabled
      >
        VERIFY &amp; SUBMIT
      </button>


      <!-- SCAN NEXT -->

      <button
        id="resetBtn"
        onclick="scanNext()"
      >
        SCAN NEXT
      </button>


    </div>

  </div>


<script>

/* ============================================================
   GOOGLE APPS SCRIPT WEB APP URL
   ============================================================ */

const API_URL =
  "https://script.google.com/macros/s/AKfycbz9gJGSaf7iamJrrGVH8gM_bDvfkP5AsTmaopqfd7GP0SGXFNeIRPyazrXbZUr_NP0QlQ/exec";


/* ============================================================
   GLOBAL VARIABLES
   ============================================================ */

let qrScanner = null;

let scannerRunning = false;

let currentRegistrationId = "";

let scanLocked = false;


/* ============================================================
   SHORT ELEMENT FUNCTION
   ============================================================ */

function $(id) {

  return document.getElementById(id);

}


/* ============================================================
   STATUS
   ============================================================ */

function showStatus(message, type) {

  const status = $("status");

  status.textContent = message;

  status.className = "";

  status.classList.add(type);

  status.style.display = "block";

}


function hideStatus() {

  const status = $("status");

  status.textContent = "";

  status.className = "";

  status.style.display = "none";

}


/* ============================================================
   PROCESS QR CODE
   ============================================================ */

function handleQRResult(decodedText) {

  console.log(
    "QR RAW DATA:",
    decodedText
  );


  /* Prevent duplicate scan */

  if (scanLocked) {

    return;

  }


  scanLocked = true;


  try {


    /* ==========================================
       PARSE QR JSON
    ========================================== */

    const data =
      JSON.parse(decodedText);


    console.log(
      "QR JSON:",
      data
    );


    /* ==========================================
       REGISTRATION ID
    ========================================== */

    currentRegistrationId =
      String(
        data.reg || ""
      ).trim();


    console.log(
      "REGISTRATION ID:",
      currentRegistrationId
    );


    /* ==========================================
       CHECK REGISTRATION
    ========================================== */

    if (!currentRegistrationId) {

      showStatus(
        "Registration ID not found in QR code.",
        "error"
      );

      scanLocked = false;

      return;

    }


    /* ==========================================
       SHOW DATA
    ========================================== */

    $("reg_id").textContent =
      currentRegistrationId;


    $("team").textContent =
      data.team || "—";


    $("leader").textContent =
      data.leader || "—";


    $("members").textContent =
      data.members || "—";


    $("events").textContent =
      data.events || "—";


    /* ==========================================
       ENABLE VERIFY
    ========================================== */

    $("verifyBtn").disabled = false;

    $("verifyBtn").textContent =
      "VERIFY & SUBMIT";


    hideStatus();


    /* ==========================================
       STOP CAMERA
    ========================================== */

    stopScanner();


  } catch (error) {


    console.error(
      "QR PARSE ERROR:",
      error
    );


    showStatus(
      "Invalid QR code. Please scan the official entry pass.",
      "error"
    );


    scanLocked = false;

  }

}


/* ============================================================
   START SCANNER
   ============================================================ */

async function startScanner() {


  /* Prevent duplicate camera */

  if (scannerRunning) {

    console.log(
      "Scanner already running."
    );

    return;

  }


  try {


    /* ==========================================
       CREATE SCANNER
    ========================================== */

    if (!qrScanner) {

      qrScanner =
        new Html5Qrcode("reader");

    }


    /* ==========================================
       CONFIG
    ========================================== */

    const config = {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0,

      rememberLastUsedCamera: true

    };


    /* ==========================================
       START CAMERA
    ========================================== */

    await qrScanner.start(

      {
        facingMode: "environment"
      },

      config,

      function(decodedText) {

        handleQRResult(
          decodedText
        );

      },

      function(errorMessage) {

        /*
          Normal scanning errors are ignored.
          The camera is still working.
        */

      }

    );


    scannerRunning = true;

    console.log(
      "CAMERA STARTED"
    );


  } catch (error) {


    console.error(
      "CAMERA START ERROR:",
      error
    );


    scannerRunning = false;


    showStatus(
      "Camera could not start. Please allow camera permission and try again.",
      "error"
    );

  }

}


/* ============================================================
   STOP SCANNER
   ============================================================ */

async function stopScanner() {


  if (
    !qrScanner ||
    !scannerRunning
  ) {

    return;

  }


  try {


    await qrScanner.stop();


    scannerRunning = false;


    console.log(
      "CAMERA STOPPED"
    );


  } catch (error) {


    console.error(
      "CAMERA STOP ERROR:",
      error
    );


    scannerRunning = false;

  }

}


/* ============================================================
   VERIFY & SUBMIT
   ============================================================ */

async function verifyAndSubmit() {


  /* ==========================================
     GET REGISTRATION ID
  ========================================== */

  const regId =
    String(
      currentRegistrationId || ""
    ).trim();


  console.log(
    "VERIFY REGISTRATION:",
    regId
  );


  /* ==========================================
     CHECK
  ========================================== */

  if (!regId) {

    showStatus(
      "Please scan a QR code first.",
      "error"
    );

    return;

  }


  /* ==========================================
     BUTTON
  ========================================== */

  const button =
    $("verifyBtn");


  button.disabled = true;

  button.textContent =
    "VERIFYING...";


  hideStatus();


  try {


    /* ==========================================
       API URL

       Example:

       ?action=verify
       &reg_id=TGX26-ES-X001
    ========================================== */

    const verifyURL =
      API_URL +
      "?action=verify&reg_id=" +
      encodeURIComponent(
        regId
      );


    console.log(
      "API REQUEST:",
      verifyURL
    );


    /* ==========================================
       REQUEST
    ========================================== */

    const response =
      await fetch(
        verifyURL,
        {
          method: "GET",
          cache: "no-cache",
          redirect: "follow"
        }
      );


    console.log(
      "HTTP STATUS:",
      response.status
    );


    /* ==========================================
       RESPONSE
    ========================================== */

    const responseText =
      await response.text();


    console.log(
      "SERVER RESPONSE:",
      responseText
    );


    /* ==========================================
       PARSE JSON
    ========================================== */

    let result;


    try {

      result =
        JSON.parse(
          responseText
        );

    } catch (error) {


      console.error(
        "JSON PARSE ERROR:",
        error
      );


      showStatus(
        "Invalid response from Google Apps Script.",
        "error"
      );


      button.disabled = false;

      button.textContent =
        "VERIFY & SUBMIT";


      return;

    }


    console.log(
      "RESULT:",
      result
    );


    /* ==========================================
       UPDATED
    ========================================== */

    if (
      result.success === true &&
      result.message === "UPDATED"
    ) {


      button.textContent =
        "✓ VERIFIED";


      showStatus(
        "✓ VERIFIED SUCCESSFULLY — PRESENT",
        "success"
      );


      /*
        Keep scanner stopped.
        User presses SCAN NEXT.
      */


      return;

    }


    /* ==========================================
       DUPLICATE
    ========================================== */

    if (
      result.message === "DUPLICATE"
    ) {


      button.textContent =
        "ALREADY PRESENT";


      showStatus(
        "⚠ This registration is already PRESENT.",
        "error"
      );


      return;

    }


    /* ==========================================
       NOT FOUND
    ========================================== */

    button.disabled = false;

    button.textContent =
      "VERIFY & SUBMIT";


    showStatus(

      "Verification failed: " +

      (
        result.message ||
        "Registration not found"
      ),

      "error"

    );


    console.log(
      "REGISTRATION SENT:",
      regId
    );


  } catch (error) {


    console.error(
      "VERIFY ERROR:",
      error
    );


    button.disabled = false;

    button.textContent =
      "VERIFY & SUBMIT";


    showStatus(
      "Unable to connect to verification server.",
      "error"
    );

  }

}


/* ============================================================
   SCAN NEXT
   ============================================================ */

async function scanNext() {


  console.log(
    "SCAN NEXT CLICKED"
  );


  /* ==========================================
     STOP OLD SCANNER FIRST
  ========================================== */

  if (qrScanner) {

    try {

      if (scannerRunning) {

        await qrScanner.stop();

      }

    } catch (error) {

      console.log(
        "Old scanner already stopped."
      );

    }

  }


  scannerRunning = false;


  /* ==========================================
     CLEAR DATA
  ========================================== */

  currentRegistrationId = "";

  scanLocked = false;


  $("reg_id").textContent =
    "—";

  $("team").textContent =
    "—";

  $("leader").textContent =
    "—";

  $("members").textContent =
    "—";

  $("events").textContent =
    "—";


  /* ==========================================
     RESET VERIFY
  ========================================== */

  $("verifyBtn").disabled =
    true;

  $("verifyBtn").textContent =
    "VERIFY & SUBMIT";


  hideStatus();


  /* ==========================================
     CLEAR OLD CAMERA UI
  ========================================== */

  $("reader").innerHTML = "";


  /*
     IMPORTANT:

     html5-qrcode creates a scanner object
     attached to the old reader element.

     Therefore create a fresh scanner.
  */

  qrScanner = null;


  /* ==========================================
     WAIT A LITTLE
  ========================================== */

  await new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        300
      );

    }
  );


  /* ==========================================
     START CAMERA AGAIN
  ========================================== */

  await startScanner();

}


/* ============================================================
   PAGE LOAD
   ============================================================ */

window.addEventListener(
  "load",
  function() {

    console.log(
      "PAGE LOADED"
    );

    startScanner();

  }
);

</script>

</body>
</html>
