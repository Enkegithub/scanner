<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HAKERRANNK 2026 – Entry Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, Arial, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
}
header {
  background: #020617;
  padding: 14px;
  text-align: center;
  font-size: 18px;
  font-weight: 600;
  color: #38bdf8;
}
.container {
  max-width: 420px;
  margin: auto;
  padding: 14px;
}
#reader {
  width: 100%;
  margin-top: 14px;
  border-radius: 12px;
  overflow: hidden;
}
.card {
  background: #020617;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 14px;
  margin-top: 14px;
}
.label {
  font-size: 13px;
  color: #94a3b8;
}
.value {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 8px;
}
button {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  font-weight: 700;
  background: #22c55e;
  color: #022c22;
}
button:disabled {
  background: #64748b;
}
</style>
</head>

<body>

<header>HAKERRANNK 2026 – Entry Scanner</header>

<div class="container">

  <div id="reader"></div>

  <div class="card">
    <div class="label">Registration ID</div>
    <div class="value" id="regId">—</div>

    <div class="label">Team Name</div>
    <div class="value" id="team">—</div>

    <div class="label">Team Leader</div>
    <div class="value" id="leader">—</div>

    <div class="label">Members</div>
    <div class="value" id="members">—</div>

    <div class="label">Event(s)</div>
    <div class="value" id="events">—</div>
  </div>

  <button id="submitBtn" onclick="verify()" disabled>
    VERIFY & SUBMIT
  </button>
</div>

<!-- POPUP -->
<div id="popup" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:999; align-items:center; justify-content:center;">
  <div id="popupBox" style="background:#020617; border-radius:20px; padding:30px; text-align:center; width:80%; max-width:300px;">
    <div id="popupIcon" style="font-size:64px;"></div>
    <div id="popupText" style="margin-top:12px; font-size:18px; font-weight:700;"></div>
  </div>
</div>

<!-- SOUNDS -->
<audio id="soundSuccess" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="soundError" src="https://assets.mixkit.co/active_storage/sfx/2020/2020-preview.mp3"></audio>

<script>
/* ================= CONFIG ================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbz9gJGSaf7iamJrrGVH8gM_bDvfkP5AsTmaopqfd7GP0SGXFNeIRPyazrXbZUr_NP0QlQ/exec";

/* ========================================= */

let scanned = false;
let scannedData = null;

const qr = new Html5Qrcode("reader");

/* CAMERA START */
qr.start(
  { facingMode: { exact: "environment" } },
  { fps: 10, qrbox: 250 },
  onScanSuccess
).catch(() => {
  Html5Qrcode.getCameras().then(cameras => {
    qr.start(
      cameras[cameras.length - 1].id,
      { fps: 10, qrbox: 250 },
      onScanSuccess
    );
  });
});

/* SCAN HANDLER */
function onScanSuccess(text) {
  if (scanned) return;

  try {
    const data = JSON.parse(text);
    if (!data.reg) return;

    scanned = true;
    scannedData = data;

    document.getElementById("regId").innerText = data.reg;
    document.getElementById("team").innerText = data.team || "-";
    document.getElementById("leader").innerText = data.leader || "-";
    document.getElementById("members").innerText = data.members || "-";
    document.getElementById("events").innerText = data.events || "-";

    document.getElementById("submitBtn").disabled = false;
    qr.stop();
  } catch (e) {}
}

/* VERIFY WITH BUFFER + SOUND */
function verify() {
  if (!scannedData || !scannedData.reg) {
    document.getElementById("soundError").play();
    showPopup("error", "INVALID QR");
    return;
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.innerText = "VERIFYING… ⏳";

  fetch(API_URL + "?reg_id=" + encodeURIComponent(scannedData.reg))
    .then(r => r.text())
    .then(t => {
      console.log("API:", t);

      setTimeout(() => {
        if (t === "UPDATED") {
          document.getElementById("soundSuccess").play();
          showPopup("success", "ENTRY SUCCESS");
        } 
        else if (t === "DUPLICATE") {
          document.getElementById("soundError").play();
          showPopup("error", "DUPLICATE ENTRY");
        } 
        else {
          document.getElementById("soundError").play();
          showPopup("error", "TEAM NOT EXIST");
        }
      }, 400); // buffer
    })
    .catch(() => {
      document.getElementById("soundError").play();
      showPopup("error", "NETWORK ERROR");
    });
}

/* POPUP */
function showPopup(type, message) {
  const popup = document.getElementById("popup");
  const icon = document.getElementById("popupIcon");
  const text = document.getElementById("popupText");
  const box = document.getElementById("popupBox");

  if (type === "success") {
    icon.innerHTML = "✅";
    box.style.border = "2px solid #22c55e";
    text.style.color = "#22c55e";
  } else {
    icon.innerHTML = "❌";
    box.style.border = "2px solid #ef4444";
    text.style.color = "#ef4444";
  }

  text.innerText = message;
  popup.style.display = "flex";

  setTimeout(() => {
    popup.style.display = "none";
    resetScanner();
  }, type === "success" ? 1500 : 2000);
}

/* RESET */
function resetScanner() {
  scanned = false;
  scannedData = null;

  document.getElementById("regId").innerText = "—";
  document.getElementById("team").innerText = "—";
  document.getElementById("leader").innerText = "—";
  document.getElementById("members").innerText = "—";
  document.getElementById("events").innerText = "—";

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.innerText = "VERIFY & SUBMIT";

  qr.start(
    { facingMode: { exact: "environment" } },
    { fps: 10, qrbox: 250 },
    onScanSuccess
  );
}
</script>

</body>
</html>
