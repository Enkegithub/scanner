<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Entry Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e5e7eb}
header{background:#020617;padding:14px;text-align:center;color:#38bdf8;font-weight:700}
.container{max-width:420px;margin:auto;padding:14px}
#reader{margin-top:14px}
.card{background:#020617;border:1px solid #334155;border-radius:12px;padding:14px;margin-top:14px}
button{width:100%;margin-top:16px;padding:14px;border-radius:10px;border:none;font-weight:700;background:#22c55e}
button:disabled{background:#64748b}
.status{margin-top:14px;padding:12px;border-radius:10px;text-align:center;font-weight:700}
.ok{background:#14532d;color:#22c55e}
.err{background:#450a0a;color:#f87171}
</style>
</head>

<body>
<header>ENTRY SCANNER</header>

<div class="container">
  <div id="reader"></div>

  <div class="card">
    <div>Reg ID: <b id="reg">—</b></div>
    <div>Team: <b id="team">—</b></div>
    <div>Leader: <b id="leader">—</b></div>
    <div>Members: <b id="members">—</b></div>
    <div>Events: <b id="events">—</b></div>
  </div>

  <button id="btn" onclick="verify()" disabled>VERIFY & SUBMIT</button>
  <div id="result"></div>
</div>

<script>
const API_URL = "YOUR_APPS_SCRIPT_EXEC_URL";

let scanned = false;
let data = null;

const qr = new Html5Qrcode("reader");

qr.start(
  { facingMode: { exact: "environment" } },
  { fps: 10, qrbox: 250 },
  onScan
);

function onScan(text) {
  if (scanned) return;

  try {
    const obj = JSON.parse(text);

    scanned = true;
    data = obj;

    reg.innerText = obj.reg;
    team.innerText = obj.team;
    leader.innerText = obj.leader;
    members.innerText = obj.members;
    events.innerText = obj.events;

    btn.disabled = false;
    qr.stop();
  } catch (e) {
    // Not our QR
  }
}

function verify() {
  btn.disabled = true;
  btn.innerText = "VERIFYING…";

  fetch(API_URL + "?reg_id=" + encodeURIComponent(data.reg))
    .then(r => r.text())
    .then(res => {
      if (res === "UPDATED") {
        show("ENTRY SUCCESS", true);
      } else if (res === "DUPLICATE") {
        show("DUPLICATE ENTRY", false);
      } else {
        show("NOT FOUND", false);
      }
    })
    .catch(() => show("NETWORK ERROR", false));
}

function show(msg, ok) {
  result.innerHTML =
    `<div class="status ${ok ? "ok" : "err"}">${msg}</div>`;

  setTimeout(reset, ok ? 1500 : 2000);
}

function reset() {
  scanned = false;
  data = null;
  btn.disabled = true;
  btn.innerText = "VERIFY & SUBMIT";

  reg.innerText = team.innerText =
  leader.innerText = members.innerText =
  events.innerText = "—";

  result.innerHTML = "";

  qr.start(
    { facingMode: { exact: "environment" } },
    { fps: 10, qrbox: 250 },
    onScan
  );
}
</script>
</body>
</html>
