<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Entry Scanner</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e5e7eb}
header{background:#020617;padding:14px;text-align:center;color:#38bdf8;font-weight:700}
.container{max-width:420px;margin:auto;padding:14px}
#reader{margin-top:14px}
.card{background:#020617;border:1px solid #334155;border-radius:12px;padding:14px;margin-top:14px}
button{width:100%;margin-top:16px;padding:14px;border-radius:10px;border:none;font-weight:700;background:#22c55e}
button:disabled{background:#64748b}
</style>
</head>

<body>
<header>ENTRY SCANNER</header>

<div class="container">
  <div id="reader"></div>

  <div class="card">
    <div>Reg ID: <b id="reg">—</b></div>
    <div>Team: <b id="team">—</b></div>
    <div>Leader: <b id="leader">—</b></div>
    <div>Members: <b id="members">—</b></div>
    <div>Events: <b id="events">—</b></div>
  </div>

  <button id="btn" onclick="verify()" disabled>VERIFY & SUBMIT</button>
</div>

<!-- POPUP -->
<div id="popup" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center">
  <div id="box" style="background:#020617;padding:30px;border-radius:20px;text-align:center">
    <div id="icon" style="font-size:64px"></div>
    <div id="msg" style="margin-top:12px;font-weight:700"></div>
  </div>
</div>

<audio id="ok" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="err" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

<script>
const API_URL = "PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE";

let scanned=false, data=null, timer=null;
const qr=new Html5Qrcode("reader");

qr.start({facingMode:{exact:"environment"}},{fps:10,qrbox:250},scan);

function scan(text){
  if(scanned) return;
  scanned=true;

  fetch(API_URL+"?reg_id="+encodeURIComponent(text.trim()))
    .then(r=>r.json())
    .then(res=>{
      if(res.status==="FOUND"){
        data=res;
        showData(res);
        document.getElementById("btn").disabled=false;
        qr.stop();
      }
      else if(res.status==="DUPLICATE"){
        error("DUPLICATE ENTRY");
      }
      else{
        error("TEAM NOT EXIST");
      }
    })
    .catch(()=>error("NETWORK ERROR"));
}

function showData(d){
  reg.innerText=d.reg;
  team.innerText=d.team;
  leader.innerText=d.leader;
  members.innerText=d.members;
  events.innerText=d.events;
}

function verify(){
  btn.disabled=true;
  btn.innerText="VERIFYING…";

  fetch(API_URL,{method:"POST",body:new URLSearchParams({reg_id:data.reg})})
    .then(r=>r.json())
    .then(res=>{
      if(res.status==="UPDATED") success("ENTRY SUCCESS");
      else error("ERROR");
    });
}

function success(msg){
  ok.play(); popup("✅",msg,1500);
}

function error(msg){
  err.play(); popup("❌",msg,2000);
}

function popup(icon,text,time){
  iconEl.innerText=icon; msg.innerText=text;
  popupEl.style.display="flex";
  timer=setTimeout(reset,time);
}

function reset(){
  popupEl.style.display="none";
  scanned=false; data=null;
  btn.disabled=true; btn.innerText="VERIFY & SUBMIT";
  reg.innerText=team.innerText=leader.innerText=members.innerText=events.innerText="—";
  qr.start({facingMode:{exact:"environment"}},{fps:10,qrbox:250},scan);
}

const popupEl=popup, iconEl=icon, msgEl=msg;
</script>
</body>
</html>
