<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HAKERRANNK 2026 – Entry Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, Arial, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
}
header {
  background: #020617;
  padding: 14px;
  text-align: center;
  font-size: 18px;
  font-weight: 600;
  color: #38bdf8;
}
.container {
  max-width: 420px;
  margin: auto;
  padding: 14px;
}
#reader {
  width: 100%;
  margin-top: 14px;
  border-radius: 12px;
  overflow: hidden;
}
.card {
  background: #020617;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 14px;
  margin-top: 14px;
}
.label {
  font-size: 13px;
  color: #94a3b8;
}
.value {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 8px;
}
button {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  font-weight: 700;
  background: #22c55e;
  color: #022c22;
}
button:disabled {
  background: #64748b;
}
.status {
  margin-top: 14px;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  font-weight: 700;
}
.ok { background: #14532d; color: #22c55e; }
.err { background: #450a0a; color: #f87171; }
</style>
</head>

<body>

<header>HAKERRANNK 2026 – Entry Scanner</header>

<div class="container">

  <div id="reader"></div>

  <div class="card">
    <div class="label">Registration ID</div>
    <div class="value" id="regId">—</div>

    <div class="label">Team Name</div>
    <div class="value" id="team">—</div>

    <div class="label">Team Leader</div>
    <div class="value" id="leader">—</div>

    <div class="label">Members</div>
    <div class="value" id="members">—</div>

    <div class="label">Event(s)</div>
    <div class="value" id="events">—</div>
  </div>

  <button id="submitBtn" onclick="verify()" disabled>
    VERIFY & SUBMIT
  </button>

  <div id="result"></div>
</div>

<script>
/* ================= CONFIG ================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyvY-N_nK4uY7_sgoRE_p9SlJ_1OPkBafME1wotWH3eDbjICpUj6MXMZAt3gjiyg1-EsA/exec";

/* ========================================= */

let scannedData = null;
let scanned = false;

const qr = new Html5Qrcode("reader");

/* START CAMERA */
qr.start(
  { facingMode: { exact: "environment" } },
  { fps: 10, qrbox: 250 },
  onScanSuccess
).catch(() => {
  Html5Qrcode.getCameras().then(cameras => {
    qr.start(
      cameras[cameras.length - 1].id,
      { fps: 10, qrbox: 250 },
      onScanSuccess
    );
  });
});

/* SCAN HANDLER */
function onScanSuccess(text) {
  if (scanned) return;

  try {
    const data = JSON.parse(text);

    if (!data.reg) return;

    scanned = true;
    scannedData = data;

    document.getElementById("regId").innerText = data.reg;
    document.getElementById("team").innerText = data.team || "-";
    document.getElementById("leader").innerText = data.leader || "-";
    document.getElementById("members").innerText = data.members || "-";
    document.getElementById("events").innerText = data.events || "-";

    document.getElementById("submitBtn").disabled = false;

    qr.stop();
  } catch (e) {
    // ignore non-json QR
  }
}

/* SUBMIT */
function verify() {
  if (!scannedData || !scannedData.reg) {
    alert("Invalid QR. Scan again.");
    return;
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.innerText = "SUBMITTED ✔";

  document.getElementById("result").innerHTML =
    `<div class="status ok">ENTRY RECORDED</div>`;

  fetch(API_URL + "?reg_id=" + encodeURIComponent(scannedData.reg))
    .then(r => r.text())
    .then(t => {
      console.log("API RESPONSE:", t);
      if (t !== "UPDATED" && t !== "ALREADY PRESENT") {
        alert("Sheet response: " + t);
      }
    })
    .catch(() => alert("API ERROR"));
}
</script>

</body>
</html>
