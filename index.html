<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tech Genesis 2K26 Scanner</title>

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    .details {
      margin-top: 25px;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .label {
      font-size: 13px;
      font-weight: bold;
      color: #666;
      margin-top: 12px;
    }

    .value {
      font-size: 17px;
      font-weight: 600;
      margin-top: 4px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 8px;
      word-break: break-word;
    }

    #verifyBtn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #00ADAC;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #verifyBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #resetBtn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-size: 15px;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      display: none;
    }

    .success {
      background: #dff7e8;
      color: #16733b;
    }

    .error {
      background: #ffe3e3;
      color: #b42318;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Tech Genesis 2K26</h1>

  <!-- =====================================================
       QR SCANNER
       ===================================================== -->

  <div id="reader"></div>


  <!-- =====================================================
       PARTICIPANT DETAILS
       ===================================================== -->

  <div class="details">

    <div class="label">Registration ID</div>
    <div class="value" id="reg_id">—</div>


    <div class="label">Team Name</div>
    <div class="value" id="team">—</div>


    <div class="label">Team Leader</div>
    <div class="value" id="leader">—</div>


    <div class="label">Members</div>
    <div class="value" id="members">—</div>


    <div class="label">Event(s)</div>
    <div class="value" id="events">—</div>


    <!-- STATUS -->

    <div id="status"></div>


    <!-- VERIFY -->

    <button
      id="verifyBtn"
      onclick="verifyAndSubmit()"
      disabled
    >
      VERIFY & SUBMIT
    </button>


    <!-- RESET -->

    <button
      id="resetBtn"
      onclick="resetParticipantDetails()"
    >
      SCAN NEXT
    </button>

  </div>

</div>


<script>

/* ============================================================
   GOOGLE APPS SCRIPT WEB APP
   ============================================================ */

const API_URL =
  "https://script.google.com/macros/s/AKfycbz9gJGSaf7iamJrrGVH8gM_bDvfkP5AsTmaopqfd7GP0SGXFNeIRPyazrXbZUr_NP0QlQ/exec";


/* ============================================================
   CURRENT REGISTRATION ID
   ============================================================ */

let currentRegistrationId = "";


/* ============================================================
   GET ELEMENT
   ============================================================ */

function $(id) {
  return document.getElementById(id);
}


/* ============================================================
   SHOW STATUS
   ============================================================ */

function showStatus(message, type) {

  const status = $("status");

  status.textContent = message;

  status.className = type;

  status.style.display = "block";
}


/* ============================================================
   HIDE STATUS
   ============================================================ */

function hideStatus() {

  const status = $("status");

  status.style.display = "none";

}


/* ============================================================
   QR SCAN SUCCESS
   ============================================================ */

function handleQRResult(decodedText) {

  try {

    console.log("RAW QR:", decodedText);


    /* --------------------------------------------------------
       PARSE QR JSON
       -------------------------------------------------------- */

    const data =
      JSON.parse(decodedText);


    console.log("QR DATA:", data);


    /* --------------------------------------------------------
       GET REGISTRATION ID
       -------------------------------------------------------- */

    currentRegistrationId =
      String(data.reg || "").trim();


    console.log(
      "REGISTRATION ID:",
      currentRegistrationId
    );


    /* --------------------------------------------------------
       CHECK REGISTRATION ID
       -------------------------------------------------------- */

    if (!currentRegistrationId) {

      showStatus(
        "Registration ID missing from QR.",
        "error"
      );

      return;

    }


    /* --------------------------------------------------------
       SHOW REGISTRATION ID
       -------------------------------------------------------- */

    $("reg_id").textContent =
      currentRegistrationId;


    /* --------------------------------------------------------
       SHOW TEAM
       -------------------------------------------------------- */

    $("team").textContent =
      data.team || "—";


    /* --------------------------------------------------------
       SHOW LEADER
       -------------------------------------------------------- */

    $("leader").textContent =
      data.leader || "—";


    /* --------------------------------------------------------
       SHOW MEMBERS
       -------------------------------------------------------- */

    $("members").textContent =
      data.members || "—";


    /* --------------------------------------------------------
       SHOW EVENT
       -------------------------------------------------------- */

    $("events").textContent =
      data.events || "—";


    /* --------------------------------------------------------
       ENABLE VERIFY
       -------------------------------------------------------- */

    $("verifyBtn").disabled = false;

    $("verifyBtn").textContent =
      "VERIFY & SUBMIT";


    hideStatus();


  } catch (error) {

    console.error(
      "QR PARSE ERROR:",
      error
    );


    showStatus(
      "Invalid QR code.",
      "error"
    );

  }

}


/* ============================================================
   VERIFY REGISTRATION
   ============================================================ */

async function verifyAndSubmit() {


  /* ----------------------------------------------------------
     GET REGISTRATION ID
     ---------------------------------------------------------- */

  const regId =
    String(
      currentRegistrationId || ""
    ).trim();


  console.log(
    "VERIFYING REGISTRATION:",
    regId
  );


  /* ----------------------------------------------------------
     CHECK ID
     ---------------------------------------------------------- */

  if (!regId) {

    showStatus(
      "Please scan a QR code first.",
      "error"
    );

    return;

  }


  /* ----------------------------------------------------------
     DISABLE BUTTON
     ---------------------------------------------------------- */

  const button =
    $("verifyBtn");


  button.disabled = true;

  button.textContent =
    "VERIFYING...";


  hideStatus();


  try {


    /* --------------------------------------------------------
       CREATE API URL
       -------------------------------------------------------- */

    const verifyURL =
      API_URL +
      "?action=verify&reg_id=" +
      encodeURIComponent(regId);


    console.log(
      "REQUEST:",
      verifyURL
    );


    /* --------------------------------------------------------
       SEND REQUEST
       -------------------------------------------------------- */

    const response =
      await fetch(
        verifyURL,
        {
          method: "GET",
          cache: "no-cache",
          redirect: "follow"
        }
      );


    console.log(
      "HTTP STATUS:",
      response.status
    );


    /* --------------------------------------------------------
       GET RESPONSE
       -------------------------------------------------------- */

    const responseText =
      await response.text();


    console.log(
      "SERVER RESPONSE:",
      responseText
    );


    /* --------------------------------------------------------
       PARSE JSON
       -------------------------------------------------------- */

    let result;


    try {

      result =
        JSON.parse(responseText);

    } catch (error) {

      console.error(
        "JSON PARSE ERROR:",
        error
      );


      showStatus(
        "Invalid response from Google Apps Script.",
        "error"
      );


      button.disabled = false;

      button.textContent =
        "VERIFY & SUBMIT";


      return;

    }


    console.log(
      "RESULT:",
      result
    );


    /* ========================================================
       SUCCESS
       ======================================================== */

    if (
      result.success === true &&
      (
        result.message === "UPDATED" ||
        result.message === "VERIFIED"
      )
    ) {


      button.textContent =
        "✓ VERIFIED";


      showStatus(
        "✓ Entry verified successfully — PRESENT",
        "success"
      );


      return;

    }


    /* ========================================================
       DUPLICATE
       ======================================================== */

    if (
      result.message === "DUPLICATE"
    ) {


      button.textContent =
        "ALREADY PRESENT";


      showStatus(
        "⚠ This registration is already PRESENT.",
        "error"
      );


      return;

    }


    /* ========================================================
       NOT FOUND / INVALID
       ======================================================== */

    button.disabled = false;

    button.textContent =
      "VERIFY & SUBMIT";


    showStatus(
      "Verification failed: " +
      (
        result.message ||
        "Unknown error"
      ),
      "error"
    );


    console.log(
      "Registration ID sent:",
      regId
    );


    console.log(
      "Server received:",
      result.received
    );


  } catch (error) {


    console.error(
      "VERIFY ERROR:",
      error
    );


    button.disabled = false;

    button.textContent =
      "VERIFY & SUBMIT";


    showStatus(
      "Unable to connect to verification server.",
      "error"
    );

  }

}


/* ============================================================
   RESET
   ============================================================ */

function resetParticipantDetails() {


  currentRegistrationId = "";


  $("reg_id").textContent =
    "—";


  $("team").textContent =
    "—";


  $("leader").textContent =
    "—";


  $("members").textContent =
    "—";


  $("events").textContent =
    "—";


  $("verifyBtn").disabled =
    true;


  $("verifyBtn").textContent =
    "VERIFY & SUBMIT";


  hideStatus();

}


/* ============================================================
   START QR SCANNER
   ============================================================ */

let qrScanner = null;


function startScanner() {


  qrScanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0

  };


  qrScanner.start(

    {
      facingMode: "environment"
    },

    config,

    function(decodedText) {


      console.log(
        "QR SCANNED:",
        decodedText
      );


      /* -----------------------------------------------
         PROCESS QR
         ----------------------------------------------- */

      handleQRResult(
        decodedText
      );


      /* -----------------------------------------------
         STOP CAMERA AFTER SUCCESSFUL SCAN
         ----------------------------------------------- */

      qrScanner.stop()
        .then(function() {

          console.log(
            "Scanner stopped."
          );

        })
        .catch(function(error) {

          console.error(
            "Scanner stop error:",
            error
          );

        });

    },

    function(errorMessage) {

      // Ignore normal scanning errors

    }

  ).catch(function(error) {

    console.error(
      "CAMERA ERROR:",
      error
    );


    showStatus(
      "Camera permission is required.",
      "error"
    );

  });

}


/* ============================================================
   START WHEN PAGE LOADS
   ============================================================ */

window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);

</script>

</body>
</html>
